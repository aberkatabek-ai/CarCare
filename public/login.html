<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | CarCare</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <script
        src="/js/api.js"
        defer
    ></script>

    <script
        src="/js/auth.js"
        defer
    ></script>
</head>

<body class="auth-body">
    <main class="auth-container">
        <section class="auth-card">
            <div class="brand">
                <div class="brand-icon">C</div>

                <div>
                    <h1>CarCare</h1>
                    <p>Vehicle Intelligence</p>
                </div>
            </div>

            <div class="auth-heading">
                <h2>Welcome back</h2>
                <p>Log in to manage your vehicles and maintenance plans.</p>
            </div>

            <form
                id="login-form"
                method="post"
            >
                <div class="form-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-input-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-password-toggle
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <p class="auth-helper-row">
                    <a
                        href="/forgot-password.html"
                        class="auth-inline-link"
                    >
                        Forgot password?
                    </a>
                </p>

                <p
                    id="form-message"
                    class="form-message"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Log in
                </button>
            </form>

            <p class="auth-switch">
                Do not have an account?
                <a href="/register.html">Create an account</a>
            </p>
        </section>
    </main>
</body>
</html>
