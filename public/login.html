<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | CarCare</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/tailwind.css?v=20260820-red1"
    >

    <script
        src="/js/i18n.js?v=20260819-i18n1"
        defer
    ></script>

    <script
        src="/js/core/runtime.js"
        defer
    ></script>

    <script
        src="/js/api.js"
        defer
    ></script>

    <script
        src="/js/core/password-validation.js"
        defer
    ></script>

    <script
        src="/js/pages/auth-page.js"
        defer
    ></script>

    <script
        src="/js/auth.js"
        defer
    ></script>
</head>

<body class="auth-body cc-auth-body">
    <main class="auth-container cc-auth-container">
        <section class="auth-card cc-auth-card">
            <div class="brand cc-brand-lockup">
                <div class="brand-icon">CC</div>

                <div>
                    <h1>CarCare</h1>
                    <p>Vehicle Intelligence</p>
                </div>
            </div>

            <div class="auth-heading cc-auth-heading">
                <h2 class="cc-auth-title">Welcome back</h2>
                <p class="cc-auth-copy">Log in to manage your vehicles and maintenance plans.</p>
            </div>

            <form
                id="login-form"
                method="post"
            >
                <div class="form-group cc-field">
                    <label
                        class="cc-label"
                        for="email"
                    >
                        Email address
                    </label>

                    <input
                        class="cc-input"
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group cc-field">
                    <label
                        class="cc-label"
                        for="password"
                    >
                        Password
                    </label>

                    <div class="password-input-wrapper relative">
                        <input
                            class="cc-input pr-20"
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle absolute right-3 top-1/2 -translate-y-1/2 rounded-full bg-[#f6efe2] px-3 py-1 text-xs font-semibold uppercase tracking-[0.14em] text-accent"
                            data-password-toggle
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <p class="auth-helper-row">
                    <a
                        href="/forgot-password"
                        class="auth-inline-link cc-helper-link"
                    >
                        Forgot password?
                    </a>
                </p>

                <p
                    id="form-message"
                    class="form-message"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    class="primary-button cc-button-primary mt-3 w-full"
                >
                    Log in
                </button>
            </form>

            <p class="auth-switch mt-6 text-center text-sm text-[#666158]">
                Do not have an account?
                <a
                    class="font-semibold text-accent hover:text-accent-strong"
                    href="/register"
                >
                    Create an account
                </a>
            </p>
        </section>
    </main>
</body>
</html>
