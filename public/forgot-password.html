<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | CarCare</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <script
        src="/js/api.js"
        defer
    ></script>

    <script
        src="/js/forgot-password.js"
        defer
    ></script>
</head>

<body class="auth-body">
    <main class="auth-container">
        <section class="auth-card">
            <div class="brand">
                <div class="brand-icon">C</div>

                <div>
                    <h1>CarCare</h1>
                    <p>Vehicle Intelligence</p>
                </div>
            </div>

            <div class="auth-heading">
                <h2>Reset your password</h2>
                <p>Enter your email to receive a 6-digit verification code.</p>
            </div>

            <form id="forgot-password-form">
                <div class="form-group">
                    <label for="forgot-email">Email address</label>

                    <input
                        type="email"
                        id="forgot-email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <p
                    id="forgot-message"
                    class="form-message"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Send verification code
                </button>
            </form>

            <div class="auth-section-divider"></div>

            <section
                id="reset-section"
                hidden
            >
                <div class="auth-subsection-heading">
                    <h3>Enter code and new password</h3>
                    <p>Use the code from your email to finish the reset.</p>
                </div>

                <form id="reset-password-form">
                    <div class="form-group">
                        <label for="reset-email">Email address</label>

                        <input
                            type="email"
                            id="reset-email"
                            name="email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="reset-code">Verification code</label>

                        <input
                            type="text"
                            id="reset-code"
                            name="code"
                            inputmode="numeric"
                            maxlength="6"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="new-password">New password</label>

                        <input
                            type="password"
                            id="new-password"
                            name="newPassword"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm new password</label>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirmPassword"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <p
                        id="reset-message"
                        class="form-message"
                        aria-live="polite"
                    ></p>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Reset password
                    </button>
                </form>
            </section>

            <p class="auth-switch">
                Remembered your password?
                <a href="/login.html">Back to login</a>
            </p>
        </section>
    </main>
</body>
</html>
