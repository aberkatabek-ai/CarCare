<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | CarCare</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <script
        src="/js/api.js"
        defer
    ></script>

    <script
        src="/js/auth.js"
        defer
    ></script>
</head>

<body class="auth-body">
    <main class="auth-container">
        <section class="auth-card">
            <div class="brand">
                <div class="brand-icon">C</div>

                <div>
                    <h1>CarCare</h1>
                    <p>Vehicle Intelligence</p>
                </div>
            </div>

            <div class="auth-heading">
                <h2>Create your account</h2>
                <p>Start tracking your vehicles and maintenance history.</p>
            </div>

            <form
                id="register-form"
                method="post"
            >
                <div class="form-group">
                    <label for="full-name">Full name</label>

                    <input
                        type="text"
                        id="full-name"
                        name="fullName"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-input-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-password-toggle
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>

                    <p class="input-hint">
                        Use at least 8 characters, including uppercase, lowercase, a number, and a special character, with no spaces.
                    </p>
                </div>

                <div class="form-group">
                    <label for="password-confirmation">
                        Confirm password
                    </label>

                    <div class="password-input-wrapper">
                        <input
                            type="password"
                            id="password-confirmation"
                            name="passwordConfirmation"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-password-toggle
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <p
                    id="form-message"
                    class="form-message"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Create account
                </button>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="/login.html">Log in</a>
            </p>
        </section>
    </main>
</body>
</html>
