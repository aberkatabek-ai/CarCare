<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Service History | CarCare</title>

    <link
        rel="stylesheet"
        href="/css/style.css?v=20260820-blue1"
    >

    <link
        rel="stylesheet"
        href="/css/maintenance.css?v=20260810-mobile2"
    >

    <link
        rel="stylesheet"
        href="/css/service-history.css"
    >

    <link
        rel="stylesheet"
        href="/css/tailwind.css?v=20260820-blue1"
    >

    <script
        src="/js/i18n.js?v=20260819-i18n1"
        defer
    ></script>

    <script
        src="/js/api.js?v=20260810-mobile2"
        defer
    ></script>

    <script
        src="/js/service-history.js"
        defer
    ></script>
</head>

<body class="dashboard-body">
    <header class="dashboard-header border-b border-[rgba(200,190,177,0.65)] bg-[rgba(248,244,235,0.82)] backdrop-blur">
        <div class="dashboard-header-content cc-header-shell">
            <div class="brand compact cc-brand-lockup">
                <div class="brand-icon">CC</div>

                <div>
                    <h1>CarCare</h1>
                    <p>Vehicle Intelligence</p>
                </div>
            </div>

            <div class="header-actions cc-nav-row">
                <a
                    class="nav-link cc-nav-link"
                    href="/"
                >
                    Dashboard
                </a>

                <a
                    class="nav-link cc-nav-link"
                    href="/maintenance"
                >
                    Maintenance
                </a>

                <a
                    class="nav-link active cc-nav-link cc-nav-link-active"
                    href="/service-history"
                >
                    Service history
                </a>

                <button
                    id="logout-button"
                    class="secondary-button cc-button-secondary"
                    type="button"
                >
                    Log out
                </button>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <section class="page-heading-card history-heading">
            <div>
                <p class="eyebrow">
                    Vehicle records
                </p>

                <h2>Service history</h2>

                <p>
                    Review completed maintenance work,
                    expenses and service information.
                </p>
            </div>

            <div class="status-badge">
                <span id="account-name">
                    Loading...
                </span>
            </div>
        </section>

        <section class="history-summary-grid">
            <article class="history-summary-card">
                <span class="summary-label">
                    Completed services
                </span>

                <strong id="total-services">
                    0
                </strong>
            </article>

            <article class="history-summary-card">
                <span class="summary-label">
                    Total actual cost
                </span>

                <strong id="total-cost">
                    ₺0
                </strong>
            </article>
        </section>

        <section class="dashboard-section">
            <div class="history-toolbar">
                <div>
                    <p class="eyebrow">
                        Maintenance records
                    </p>

                    <h2>Completed work</h2>
                </div>

                <div class="filter-control">
                    <label for="history-vehicle-filter">
                        Filter by vehicle
                    </label>

                    <select id="history-vehicle-filter">
                        <option value="all">
                            All vehicles
                        </option>
                    </select>
                </div>
            </div>

            <div id="service-history-list">
                <div class="loading-state">
                    Loading service history...
                </div>
            </div>
        </section>
    </main>
</body>
</html>
